<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZONE — Ton espace · Tes règles</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #FFF8F0;
    --dark: #2D2D2D;
    --blue: #4A90E2;
    --orange: #FF6B35;
    --green: #4CAF50;
    --yellow: #FFD93D;
    --purple: #9B59B6;
    --red: #E74C3C;
    --pink: #FF6B9D;
    --shadow: 4px 4px 0px rgba(0,0,0,0.15);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--cream);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }

  /* HEADER */
  .header {
    text-align: center;
    margin-bottom: 30px;
    width: 100%;
    max-width: 600px;
  }

  .logo {
    font-family: 'Fredoka One', cursive;
    font-size: 3.5rem;
    color: var(--orange);
    text-shadow: 4px 4px 0px rgba(0,0,0,0.1);
    letter-spacing: 4px;
    line-height: 1;
  }

  .tagline {
    font-size: 0.95rem;
    color: #888;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 4px;
  }

  .greeting {
    margin-top: 18px;
    font-size: 1.3rem;
    font-weight: 800;
    color: var(--dark);
  }

  .day-info {
    font-size: 1rem;
    color: #888;
    font-weight: 600;
    margin-top: 4px;
  }

  /* TUILES */
  .tiles {
    display: flex;
    flex-direction: column;
    gap: 18px;
    width: 100%;
    max-width: 420px;
  }

  .tile {
    background: white;
    border: 3px solid var(--dark);
    border-radius: 20px;
    padding: 24px 22px;
    cursor: pointer;
    transition: transform 0.12s ease, box-shadow 0.12s ease;
    box-shadow: var(--shadow);
    display: flex;
    align-items: center;
    gap: 18px;
    text-decoration: none;
    color: inherit;
  }

  .tile:active {
    transform: translate(2px, 2px);
    box-shadow: 2px 2px 0px rgba(0,0,0,0.15);
  }

  .tile-icon {
    font-size: 2.6rem;
    min-width: 56px;
    text-align: center;
  }

  .tile-content {
    flex: 1;
  }

  .tile-title {
    font-family: 'Fredoka One', cursive;
    font-size: 1.45rem;
    color: var(--dark);
    line-height: 1.2;
  }

  .tile-subtitle {
    font-size: 0.85rem;
    color: #888;
    font-weight: 600;
    margin-top: 3px;
  }

  .tile-stats {
    display: flex;
    gap: 8px;
    margin-top: 8px;
    flex-wrap: wrap;
  }

  .stat-chip {
    font-size: 0.78rem;
    font-weight: 800;
    padding: 3px 10px;
    border-radius: 20px;
    border: 2px solid currentColor;
  }

  .stat-urgent { color: var(--red); background: #FFF0EE; }
  .stat-todo   { color: var(--blue); background: #EEF4FF; }
  .stat-done   { color: var(--green); background: #EEFBEE; }

  .tile-badge {
    min-width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--red);
    color: white;
    font-size: 0.85rem;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  /* Couleurs des tuiles */
  .tile-jdc   { border-color: var(--blue); }
  .tile-jdc .tile-title { color: var(--blue); }
  .tile-max   { border-color: var(--orange); }
  .tile-max .tile-title { color: var(--orange); }
  .tile-param { border-color: var(--purple); }
  .tile-param .tile-title { color: var(--purple); }

  /* SOON badge */
  .soon {
    font-size: 0.7rem;
    font-weight: 800;
    background: var(--yellow);
    color: var(--dark);
    border: 2px solid var(--dark);
    border-radius: 12px;
    padding: 2px 8px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  /* MOTIVATION */
  .motivation {
    margin-top: 30px;
    text-align: center;
    font-size: 0.9rem;
    color: #aaa;
    font-weight: 600;
    font-style: italic;
    max-width: 360px;
  }

  /* VERSION */
  .version {
    margin-top: 16px;
    font-size: 0.75rem;
    color: #ccc;
    font-weight: 600;
  }
</style>
</head>
<body>

<div class="header">
  <div class="logo">ZONE</div>
  <div class="tagline">Ton espace · Tes règles</div>
  <div class="greeting" id="greeting">Bonjour, Ethan !</div>
  <div class="day-info" id="dayInfo"></div>
</div>

<div class="tiles">

  <!-- TUILE JDC -->
  <div class="tile tile-jdc" onclick="window.location.href='journal-de-classe.html'">
    <div class="tile-icon">📓</div>
    <div class="tile-content">
      <div class="tile-title">Journal de classe</div>
      <div class="tile-subtitle">Devoirs · Interros · Cours du jour</div>
      <div class="tile-stats" id="jdcStats"></div>
    </div>
    <div class="tile-badge" id="jdcBadge" style="display:none"></div>
  </div>

  <!-- TUILE MAX TUTOR -->
  <div class="tile tile-max" onclick="window.location.href='https://max-tutor-git-main-jacekclaes-labs-projects.vercel.app'">
    <div class="tile-icon">🤖</div>
    <div class="tile-content">
      <div class="tile-title">Max Tutor</div>
      <div class="tile-subtitle">Ton assistant IA pour apprendre</div>
    </div>
    <span class="soon">En ligne</span>
  </div>

  <!-- TUILE PARAMÈTRES -->
  <div class="tile tile-param" onclick="alert('Paramètres — bientôt disponible !')">
    <div class="tile-icon">⚙️</div>
    <div class="tile-content">
      <div class="tile-title">Paramètres</div>
      <div class="tile-subtitle">Réglages · Clé API · Profil</div>
    </div>
    <span class="soon">Bientôt</span>
  </div>

</div>

<div class="motivation" id="motivation"></div>
<div class="version">ZONE v2.0</div>

<script>
const JOURS = ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
const MOIS  = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];

const MOTIVATIONS = [
  "Chaque petit effort compte. Tu avances !",
  "Une question posée, c'est déjà une réponse trouvée.",
  "Ton cerveau, c'est un muscle. Entraîne-le.",
  "Même lentement, tu avances. C'est tout ce qui compte.",
  "Les pros font des erreurs. C'est comme ça qu'ils progressent.",
  "Pas besoin d'être parfait. Juste présent.",
  "Une tâche à la fois. Tu gères.",
  "Le secret ? Commencer. Juste commencer.",
  "Ethan, t'as déjà réussi des trucs difficiles avant.",
  "Ce que tu fais aujourd'hui te facilite demain."
];

function init() {
  const now = new Date();
  const h = now.getHours();

  // Salutation
  let sal = h < 6 ? 'Bonne nuit' : h < 12 ? 'Bonjour' : h < 18 ? 'Bon après-midi' : 'Bonsoir';
  document.getElementById('greeting').textContent = sal + ', Ethan !';

  // Jour
  const jour = JOURS[now.getDay()];
  const date = now.getDate() + ' ' + MOIS[now.getMonth()] + ' ' + now.getFullYear();
  document.getElementById('dayInfo').textContent = jour + ' ' + date;

  // Motivation aléatoire
  const mot = MOTIVATIONS[Math.floor(Math.random() * MOTIVATIONS.length)];
  document.getElementById('motivation').textContent = '"' + mot + '"';

  // Stats JDC depuis localStorage
  refreshJdcStats();
}

function refreshJdcStats() {
  try {
    const tasksRaw = localStorage.getItem('zone_jdc_tasks');
    const tasks = tasksRaw ? JSON.parse(tasksRaw) : [];
    const today = new Date();
    today.setHours(0,0,0,0);

    const total    = tasks.filter(t => !t.done).length;
    const urgent   = tasks.filter(t => !t.done && new Date(t.dueDate) <= new Date(today.getTime() + 2*86400000)).length;
    const done     = tasks.filter(t => t.done).length;

    const statsEl = document.getElementById('jdcStats');
    statsEl.innerHTML = '';

    if (total === 0 && done === 0) {
      statsEl.innerHTML = '<span class="stat-chip stat-done">Rien à faire 🎉</span>';
    } else {
      if (urgent > 0) statsEl.innerHTML += `<span class="stat-chip stat-urgent">⚡ ${urgent} urgent${urgent>1?'s':''}</span>`;
      if (total > 0)  statsEl.innerHTML += `<span class="stat-chip stat-todo">📋 ${total} à faire</span>`;
      if (done > 0)   statsEl.innerHTML += `<span class="stat-chip stat-done">✅ ${done} fait${done>1?'s':''}</span>`;
    }

    const badge = document.getElementById('jdcBadge');
    if (urgent > 0) {
      badge.textContent = urgent;
      badge.style.display = 'flex';
    } else {
      badge.style.display = 'none';
    }
  } catch(e) {
    // localStorage indisponible
  }
}

init();
</script>
</body>
</html>

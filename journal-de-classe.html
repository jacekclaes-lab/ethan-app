<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Journal de classe — Ethan</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #FFF8F0;
    --dark: #2D2D2D;
    --blue: #4A90E2;
    --orange: #FF6B35;
    --green: #4CAF50;
    --purple: #9B59B6;
    --red: #E74C3C;
    --shadow: 3px 3px 0px rgba(0,0,0,0.12);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--cream);
    min-height: 100vh;
  }

  /* ── TOP BAR ── */
  .topbar {
    background: white;
    border-bottom: 3px solid var(--dark);
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .back-btn {
    background: var(--cream);
    border: 2px solid var(--dark);
    border-radius: 10px;
    padding: 6px 12px;
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 0.85rem;
    cursor: pointer;
  }
  .topbar-title {
    font-family: 'Fredoka One', cursive;
    font-size: 1.3rem;
    color: var(--blue);
    flex: 1;
  }
  .agenda-btn {
    position: relative;
    background: var(--orange);
    border: 2px solid var(--dark);
    border-radius: 12px;
    padding: 6px 14px;
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 0.85rem;
    color: white;
    cursor: pointer;
  }
  .badge {
    background: var(--red);
    color: white;
    font-size: 0.7rem;
    font-weight: 800;
    min-width: 20px;
    height: 20px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: absolute;
    top: -8px;
    right: -8px;
    border: 2px solid white;
  }

  /* ── AGENDA PANEL ── */
  .agenda-panel {
    display: none;
    padding: 8px 16px 20px;
    background: white;
    border-bottom: 2px solid #eee;
  }
  .agenda-panel.open { display: block; }
  .agenda-title {
    font-family: 'Fredoka One', cursive;
    font-size: 1.2rem;
    color: var(--orange);
    margin-bottom: 12px;
    margin-top: 8px;
  }
  .agenda-empty {
    text-align: center;
    color: #aaa;
    font-weight: 700;
    font-size: 0.95rem;
    padding: 20px;
  }
  .agenda-group-title {
    font-size: 0.78rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: #bbb;
    margin: 10px 0 6px;
  }
  .agenda-item {
    background: white;
    border: 2px solid #E8E8E8;
    border-radius: 14px;
    padding: 10px 12px;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .agenda-item.urgent { border-color: var(--red);    background: #FFF5F5; }
  .agenda-item.soon   { border-color: var(--orange); background: #FFF8F0; }
  .agenda-check { width: 22px; height: 22px; accent-color: var(--green); cursor: pointer; flex-shrink: 0; }
  .agenda-info  { flex: 1; }
  .agenda-item-text { font-size: 0.9rem; font-weight: 700; color: var(--dark); }
  .agenda-item-meta { font-size: 0.76rem; color: #aaa; font-weight: 600; margin-top: 2px; }
  .urgency-chip { font-size: 0.72rem; font-weight: 800; padding: 2px 8px; border-radius: 8px; flex-shrink: 0; }
  .chip-red    { background: #FFE0E0; color: var(--red); }
  .chip-orange { background: #FFE8D6; color: var(--orange); }
  .chip-green  { background: #E0F5E0; color: var(--green); }

  /* ── WEEK NAV ── */
  .week-nav {
    background: white;
    border-bottom: 2px solid #eee;
    padding: 10px 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .week-nav-btn {
    background: var(--cream);
    border: 2px solid var(--dark);
    border-radius: 10px;
    padding: 6px 14px;
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 0.95rem;
    cursor: pointer;
  }
  .week-label {
    flex: 1;
    text-align: center;
    font-family: 'Fredoka One', cursive;
    font-size: 1.05rem;
    color: var(--dark);
  }
  .today-btn {
    background: var(--blue);
    color: white;
    border: 2px solid var(--dark);
    border-radius: 10px;
    padding: 6px 10px;
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 0.78rem;
    cursor: pointer;
  }

  /* ── WEEK GRID ── */
  .week-grid {
    display: flex;
    gap: 5px;
    padding: 10px 8px 24px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    align-items: flex-start;
  }
  .week-grid::-webkit-scrollbar { display: none; }

  .day-col {
    flex: 1;
    min-width: 115px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  /* Day header */
  .day-col-header {
    text-align: center;
    padding: 8px 4px 6px;
    border-radius: 12px;
    background: white;
    border: 2px solid #E8E8E8;
    margin-bottom: 2px;
  }
  .day-col-header.today {
    border-color: var(--orange);
    background: #FFF3ED;
  }
  .day-col-header.ferie {
    border-color: var(--red);
    background: #FFF0F0;
  }
  .day-col-header .day-name {
    font-family: 'Fredoka One', cursive;
    font-size: 1rem;
    color: var(--dark);
  }
  .day-col-header.today .day-name { color: var(--orange); }
  .day-col-header.ferie .day-name { color: var(--red); }
  .day-col-header .day-date {
    font-size: 0.72rem;
    color: #bbb;
    font-weight: 700;
    margin-top: 1px;
  }

  /* Slot card */
  .week-slot {
    background: white;
    border: 2px solid #E8E8E8;
    border-left: 5px solid #E8E8E8;
    border-radius: 10px;
    padding: 6px 7px 6px 9px;
    cursor: pointer;
    transition: opacity 0.1s;
    min-height: 50px;
  }
  .week-slot:active { opacity: 0.65; }

  .week-slot.pause {
    background: #FAFAFA;
    border: 1px dashed #ddd !important;
    cursor: default;
    min-height: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .ws-time    { font-size: 0.62rem; color: #ccc; font-weight: 700; }
  .ws-subject { font-family: 'Fredoka One', cursive; font-size: 0.9rem; color: var(--dark); line-height: 1.2; }
  .ws-room    { font-size: 0.64rem; color: #bbb; font-weight: 600; }

  .ws-tags {
    margin-top: 4px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .ws-tag {
    font-size: 0.65rem;
    font-weight: 800;
    padding: 2px 6px;
    border-radius: 6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .wt-note    { color: var(--purple); background: #F5EEFF; }
  .wt-devoir  { color: var(--blue);   background: #EAF2FF; }
  .wt-interro { color: var(--red);    background: #FFF0EE; }
  .wt-done    { color: #bbb;          background: #F0F0F0; text-decoration: line-through; }
  .wt-more    { color: #aaa;          background: #F5F5F5; }

  /* Bannière congé en haut DE PAGE (semaine entière) */
  .week-alert {
    background: #FFF3CD;
    border-left: 5px solid #FF6B35;
    border-radius: 0;
    padding: 9px 16px;
    font-size: 0.85rem;
    font-weight: 800;
    color: #7A4100;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    line-height: 1.4;
  }
  #weekBanner { display: none; }

  /* ── MODAL ── */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 200;
    align-items: flex-end;
    justify-content: center;
    padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: white;
    border: 3px solid var(--dark);
    border-radius: 24px 24px 16px 16px;
    width: 100%;
    max-width: 480px;
    max-height: 85vh;
    overflow-y: auto;
    padding: 20px;
  }
  .modal-title {
    font-family: 'Fredoka One', cursive;
    font-size: 1.3rem;
    color: var(--dark);
    margin-bottom: 16px;
  }
  .type-buttons { display: flex; gap: 8px; margin-bottom: 14px; }
  .type-btn {
    flex: 1;
    padding: 10px 8px;
    border-radius: 14px;
    border: 2px solid #ddd;
    background: white;
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 0.85rem;
    cursor: pointer;
    text-align: center;
  }
  .type-btn.active-note    { border-color: var(--purple); background: #F8F0FF; color: var(--purple); }
  .type-btn.active-devoir  { border-color: var(--blue);   background: #EEF4FF; color: var(--blue); }
  .type-btn.active-interro { border-color: var(--red);    background: #FFF0EE; color: var(--red); }
  .modal-field { margin-bottom: 12px; }
  .modal-field label { display: block; font-weight: 800; font-size: 0.85rem; color: #666; margin-bottom: 5px; }
  .modal-field input, .modal-field textarea {
    width: 100%;
    padding: 10px 14px;
    border: 2px solid #ddd;
    border-radius: 12px;
    font-family: 'Nunito', sans-serif;
    font-size: 1rem;
    font-weight: 600;
    color: var(--dark);
    background: #FAFAFA;
  }
  .modal-field input:focus, .modal-field textarea:focus {
    outline: none; border-color: var(--blue); background: white;
  }
  .modal-actions { display: flex; gap: 10px; margin-top: 16px; }
  .btn-cancel {
    flex: 1; padding: 12px; border-radius: 14px;
    border: 2px solid #ddd; background: white;
    font-family: 'Nunito', sans-serif; font-weight: 800; cursor: pointer; font-size: 0.95rem;
  }
  .btn-save {
    flex: 2; padding: 12px; border-radius: 14px;
    border: 2px solid var(--blue); background: var(--blue); color: white;
    font-family: 'Nunito', sans-serif; font-weight: 800; cursor: pointer; font-size: 0.95rem;
  }

  /* ── ÉDITEUR D'ÉTAPES (modal) ── */
  .steps-add { display: flex; gap: 8px; margin-top: 8px; }
  .steps-add input {
    flex: 1; padding: 9px 12px; border: 2px solid #ddd; border-radius: 10px;
    font-family: 'Nunito', sans-serif; font-size: 0.95rem; font-weight: 600;
    color: var(--dark); background: #FAFAFA;
  }
  .steps-add input:focus { outline: none; border-color: var(--blue); background: white; }
  .steps-add button {
    background: var(--blue); color: white; border: 2px solid var(--dark);
    border-radius: 10px; width: 44px; font-size: 1.2rem; font-weight: 800; cursor: pointer;
  }
  .step-edit-row {
    display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid #f5f5f5;
  }
  .step-edit-row .num {
    font-size: 0.75rem; font-weight: 800; color: var(--blue);
    background: #EAF2FF; border-radius: 6px; padding: 2px 7px; flex-shrink: 0;
  }
  .step-edit-row .txt { flex: 1; font-size: 0.9rem; font-weight: 700; color: #555; }
  .step-edit-row button { background: none; border: none; cursor: pointer; color: #ccc; font-size: 1rem; }
  .steps-hint { font-size: 0.78rem; color: var(--green); font-weight: 700; margin-top: 8px; line-height: 1.4; }
  .step-relire-edit { font-size: 0.82rem; font-weight: 700; color: #999; padding: 8px 0 2px; }

  /* ── ÉTAPES DANS L'AGENDA "À FAIRE" ── */
  .agenda-item.has-steps { align-items: flex-start; }
  .agenda-item.has-steps .agenda-check,
  .agenda-item.has-steps .urgency-chip { margin-top: 2px; }
  .agenda-steps { margin-top: 8px; padding-top: 8px; border-top: 1px dashed #eee; }
  .progress-wrap { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .progress-bar { flex: 1; height: 10px; background: #EEE; border-radius: 6px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--green); border-radius: 6px; transition: width 0.2s; }
  .progress-label { font-size: 0.74rem; font-weight: 800; color: #888; flex-shrink: 0; }
  .step-row {
    display: flex; align-items: center; gap: 9px; padding: 7px 8px; border-radius: 10px; margin-bottom: 4px;
  }
  .step-row input { width: 20px; height: 20px; accent-color: var(--green); cursor: pointer; flex-shrink: 0; }
  .step-row .step-text { font-size: 0.88rem; font-weight: 700; line-height: 1.3; }
  .step-todo .step-text { color: #c4c4c4; }
  .step-done .step-text { color: #bbb; text-decoration: line-through; }
  .step-current { background: #FFF3ED; border: 2px solid var(--orange); }
  .step-current .step-text { color: var(--dark); }
  .steps-done-msg { font-size: 0.8rem; font-weight: 800; color: var(--green); padding: 6px 2px 2px; }
  .step-add-btn {
    background: none; border: 2px dashed var(--blue); color: var(--blue); border-radius: 9px;
    padding: 5px 11px; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 0.78rem;
    cursor: pointer; margin-top: 4px;
  }
  .step-cut-btn {
    background: #EAF2FF; border: 2px solid var(--blue); color: var(--blue); border-radius: 10px;
    padding: 7px 12px; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 0.82rem; cursor: pointer;
  }
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <button class="back-btn" onclick="window.location.href='index.html'">← Accueil</button>
  <div class="topbar-title">📓 Journal de classe</div>
  <button class="agenda-btn" onclick="toggleAgenda()">
    📋 À faire
    <span class="badge" id="agendaBadge" style="display:none"></span>
  </button>
</div>

<!-- AGENDA PANEL -->
<div class="agenda-panel" id="agendaPanel">
  <div class="agenda-title">📋 Tous mes travaux</div>
  <div id="agendaContent"></div>
</div>

<!-- WEEK NAV -->
<div class="week-nav">
  <button class="week-nav-btn" onclick="changeWeek(-1)">←</button>
  <div class="week-label" id="weekLabel"></div>
  <button class="today-btn" onclick="goToNow()">Auj.</button>
  <button class="week-nav-btn" onclick="changeWeek(1)">→</button>
</div>

<!-- WEEK BANNER (jours fériés / congés de la semaine) -->
<div id="weekBanner"></div>

<!-- WEEK GRID -->
<div class="week-grid" id="weekGrid"></div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-title" id="modalTitle">📝 Ajouter</div>

    <div class="type-buttons">
      <button class="type-btn active-note" id="btnNote"    onclick="setType('note')">📝 Note</button>
      <button class="type-btn"             id="btnDevoir"  onclick="setType('devoir')">📚 Devoir</button>
      <button class="type-btn"             id="btnInterro" onclick="setType('interro')">🔴 Interro</button>
    </div>

    <div class="modal-field">
      <label>Description</label>
      <textarea id="noteText" rows="2" placeholder="Ex : exercices page 42, apporter le livre…"></textarea>
    </div>

    <div class="modal-field" id="dueDateField" style="display:none">
      <label id="dueDateLabel">Pour le</label>
      <input type="date" id="dueDate">
    </div>

    <div class="modal-field" id="stepsField" style="display:none">
      <label>Étapes (facultatif) — découpe en petits bouts</label>
      <div id="stepsList"></div>
      <div class="steps-add">
        <input type="text" id="stepInput" placeholder="Ex : faire le plan…" onkeydown="if(event.key==='Enter'){event.preventDefault();addStep();}">
        <button type="button" onclick="addStep()">＋</button>
      </div>
      <div class="steps-hint">💡 Une dernière étape « relire avant de rendre » s'ajoute toute seule.</div>
    </div>

    <div id="existingItems"></div>

    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Annuler</button>
      <button class="btn-save"   onclick="saveNote()">Enregistrer</button>
    </div>
  </div>
</div>

var JOURS = ['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];
var MOIS  = ['jan','fév','mar','avr','mai','juin','juil','août','sep','oct','nov','déc'];
var MOIS_L = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];

// Map matière → couleur
var SUBJECT_COLORS = {};
Object.keys(SCHEDULE).forEach(function(d) {
  SCHEDULE[d].forEach(function(s) { if (!s.pause) SUBJECT_COLORS[s.s] = s.c; });
});

// ═══════════════════════════════════════
//  ÉTAT
// ═══════════════════════════════════════
var currentWeekStart = getWeekStart(new Date());
var currentSlot      = null;
var currentType      = 'note';
var currentSteps     = [];
var agendaOpen       = false;

function getWeekStart(date) {
  var d = new Date(date);
  d.setHours(0,0,0,0);
  var dow = d.getDay();
  d.setDate(d.getDate() - (dow === 0 ? 6 : dow - 1));
  return d;
}

function changeWeek(delta) {
  currentWeekStart = new Date(currentWeekStart);
  currentWeekStart.setDate(currentWeekStart.getDate() + delta * 7);
  render();
}

function goToNow() {
  currentWeekStart = getWeekStart(new Date());
  render();
}

function dateKey(d) {
  var y = d.getFullYear();
  var m = String(d.getMonth()+1).padStart(2,'0');
  var j = String(d.getDate()).padStart(2,'0');
  return y + '-' + m + '-' + j;
}

// ═══════════════════════════════════════
//  DONNÉES (localStorage)
// ═══════════════════════════════════════
function getData() {
  return {
    slotNotes: JSON.parse(localStorage.getItem('zone_slot_notes') || '{}'),
    tasks:     JSON.parse(localStorage.getItem('zone_jdc_tasks')  || '[]')
  };
}

function saveData(d) {
  localStorage.setItem('zone_slot_notes', JSON.stringify(d.slotNotes));
  localStorage.setItem('zone_jdc_tasks',  JSON.stringify(d.tasks));
}

// ═══════════════════════════════════════
//  RENDER PRINCIPAL
// ═══════════════════════════════════════
function render() {
  renderWeekLabel();
  renderWeekBanner();
  renderWeekGrid();
  renderAgendaBadge();
  if (agendaOpen) renderAgendaPanel();
}

// Bannière en haut de page listant les jours fériés/congés de la semaine affichée
function renderWeekBanner() {
  var container = document.getElementById('weekBanner');
  var items = [];

  for (var i = 0; i < 5; i++) {
    var d = new Date(currentWeekStart);
    d.setDate(currentWeekStart.getDate() + i);
    var key   = dateKey(d);
    var conge = CONGES[key];
    if (conge) {
      var dayName  = JOURS[i + 1];
      var dateStr  = d.getDate() + '/' + (d.getMonth() + 1);
      items.push('<span>' + dayName + ' ' + dateStr + ' : <strong>' + conge + '</strong></span>');
    }
  }

  if (items.length > 0) {
    container.innerHTML = '<div class="week-alert">📅 ' + items.join(' &nbsp;·&nbsp; ') + ' — cours maintenus</div>';
    container.style.display = 'block';
  } else {
    container.innerHTML = '';
    container.style.display = 'none';
  }
}

function renderWeekLabel() {
  var end = new Date(currentWeekStart);
  end.setDate(currentWeekStart.getDate() + 4);
  var s = currentWeekStart, e = end;
  var label;
  if (s.getMonth() === e.getMonth()) {
    label = s.getDate() + ' – ' + e.getDate() + ' ' + MOIS_L[e.getMonth()] + ' ' + e.getFullYear();
  } else {
    label = s.getDate() + ' ' + MOIS[s.getMonth()] + ' – ' + e.getDate() + ' ' + MOIS[e.getMonth()] + ' ' + e.getFullYear();
  }
  document.getElementById('weekLabel').textContent = label;
}

function renderWeekGrid() {
  var grid = document.getElementById('weekGrid');
  grid.innerHTML = '';
  var today = new Date(); today.setHours(0,0,0,0);

  for (var i = 0; i < 5; i++) {
    var d = new Date(currentWeekStart);
    d.setDate(currentWeekStart.getDate() + i);
    var key   = dateKey(d);
    var dow   = i + 1; // 1=Lun … 5=Ven
    var isToday = (d.getTime() === today.getTime());
    var conge   = CONGES[key] || null;

    var col = document.createElement('div');
    col.className = 'day-col';

    // En-tête du jour
    var hdr = document.createElement('div');
    hdr.className = 'day-col-header' + (isToday ? ' today' : '') + (conge ? ' ferie' : '');
    hdr.innerHTML = '<div class="day-name">' + JOURS[dow] + '</div>'
      + '<div class="day-date">' + d.getDate() + '/' + (d.getMonth()+1) + '</div>';
    col.appendChild(hdr);

    // Pas de bannière par colonne : la notice est affichée en haut de page (weekBanner)
    var slots = SCHEDULE[dow] || [];
    for (var j = 0; j < slots.length; j++) {
      col.appendChild(buildWeekSlot(slots[j], j, key));
    }

    grid.appendChild(col);
  }
}

function buildWeekSlot(slot, idx, dayKey) {
  var div = document.createElement('div');

  // Pause déjeuner
  if (slot.pause) {
    div.className = 'week-slot pause';
    div.innerHTML = '<span style="font-size:0.8rem;color:#ccc">&#127869;</span>';
    return div;
  }

  var data = getData();
  var slotKey = dayKey + '_' + idx;

  // Notes : attachées au slot du jour de CRÉATION (clé = jour où on a tapé)
  var slotNotes = data.slotNotes[slotKey] || [];

  // Devoirs / Interros : attachés à la matière sur la date d'ÉCHÉANCE
  var slotTasks = data.tasks.filter(function(t) {
    return t.dueDate === dayKey && t.subject === slot.s;
  });

  var all = slotNotes.concat(slotTasks);

  div.className = 'week-slot';
  div.style.borderLeftColor = slot.c;

  // Tags
  var tagsHTML = '';
  if (all.length > 0) {
    tagsHTML = '<div class="ws-tags">';
    var shown = all.slice(0, 3);
    for (var k = 0; k < shown.length; k++) {
      var item = shown[k];
      var cls  = item.done ? 'wt-done'
               : item.type === 'interro' ? 'wt-interro'
               : item.type === 'devoir'  ? 'wt-devoir'
               : 'wt-note';
      var icon = item.type === 'interro' ? '&#128308;'
               : item.type === 'devoir'  ? '&#128218;'
               : '&#128221;';
      var txt  = item.text.length > 17 ? item.text.substring(0,17) + '…' : item.text;
      var prog = item.dueDate ? stepProgress(item) : null;
      var prefix = (prog && !item.done) ? prog.done + '/' + prog.total + ' ' : '';
      tagsHTML += '<div class="ws-tag ' + cls + '">' + icon + ' ' + prefix + txt + '</div>';
    }
    if (all.length > 3) {
      tagsHTML += '<div class="ws-tag wt-more">+' + (all.length - 3) + '</div>';
    }
    tagsHTML += '</div>';
  }

  div.innerHTML = '<div class="ws-time">' + slot.t + '</div>'
    + '<div class="ws-subject">' + slot.s + '</div>'
    + (slot.r ? '<div class="ws-room">&#128205; ' + slot.r + '</div>' : '')
    + tagsHTML;

  (function(dk, si, sn) {
    div.onclick = function() { openModal(dk, si, sn); };
  })(dayKey, idx, slot.s);

  return div;
}

// ═══════════════════════════════════════
//  MODAL
// ═══════════════════════════════════════
function openModal(dayKey, slotIdx, subject) {
  currentSlot = { dayKey: dayKey, slotIdx: slotIdx, subject: subject };
  currentType = 'note';
  updateTypeButtons();

  document.getElementById('modalTitle').textContent = subject;
  document.getElementById('noteText').value = '';

  // Étapes : remise à zéro de l'éditeur (caché tant qu'on est sur "Note")
  currentSteps = [];
  document.getElementById('stepInput').value = '';
  document.getElementById('stepsField').style.display = 'none';
  renderStepsEditor();

  // Date par défaut = lendemain du slot
  var slotDay = new Date(dayKey + 'T00:00:00');
  slotDay.setDate(slotDay.getDate() + 1);
  document.getElementById('dueDate').value = dateKey(slotDay);
  document.getElementById('dueDateField').style.display = 'none';

  renderExistingItems();
  document.getElementById('modalOverlay').classList.add('open');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  currentSlot = null;
}

function setType(type) {
  currentType = type;
  updateTypeButtons();
  document.getElementById('dueDateField').style.display = (type === 'note') ? 'none' : 'block';
  document.getElementById('stepsField').style.display   = (type === 'note') ? 'none' : 'block';
  document.getElementById('dueDateLabel').textContent =
    type === 'interro' ? 'Date de l\'interro' : 'Pour le';
}

// ── Éditeur d'étapes (au moment de créer un devoir/interro) ──
function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function newStepId() {
  return Date.now().toString() + Math.floor(Math.random() * 1000);
}

function addStep() {
  var input = document.getElementById('stepInput');
  var v = input.value.trim();
  if (!v) return;
  currentSteps.push({ id: newStepId(), text: v, done: false });
  input.value = '';
  input.focus();
  renderStepsEditor();
}

function removeStep(idx) {
  currentSteps.splice(idx, 1);
  renderStepsEditor();
}

function renderStepsEditor() {
  var el = document.getElementById('stepsList');
  if (!el) return;
  var html = '';
  for (var i = 0; i < currentSteps.length; i++) {
    html += '<div class="step-edit-row">'
      + '<span class="num">' + (i + 1) + '</span>'
      + '<span class="txt">' + escapeHtml(currentSteps[i].text) + '</span>'
      + '<button type="button" onclick="removeStep(' + i + ')">✕</button>'
      + '</div>';
  }
  if (currentSteps.length > 0) {
    html += '<div class="step-relire-edit">👀 ' + (currentSteps.length + 1)
      + '. Relire avant de rendre</div>';
  }
  el.innerHTML = html;
}

function updateTypeButtons() {
  document.getElementById('btnNote').className    = 'type-btn' + (currentType==='note'    ? ' active-note'    : '');
  document.getElementById('btnDevoir').className  = 'type-btn' + (currentType==='devoir'  ? ' active-devoir'  : '');
  document.getElementById('btnInterro').className = 'type-btn' + (currentType==='interro' ? ' active-interro' : '');
}

function renderExistingItems() {
  if (!currentSlot) return;
  var data     = getData();
  var dayKey   = currentSlot.dayKey;
  var slotIdx  = currentSlot.slotIdx;
  var subject  = currentSlot.subject;
  var slotKey  = dayKey + '_' + slotIdx;
  var notes    = data.slotNotes[slotKey] || [];
  var tasks    = data.tasks.filter(function(t) { return t.dueDate === dayKey && t.subject === subject; });
  var all      = notes.concat(tasks);

  var el = document.getElementById('existingItems');
  if (all.length === 0) { el.innerHTML = ''; return; }

  var html = '<div style="font-size:0.8rem;font-weight:800;color:#aaa;margin:8px 0 4px">Déjà enregistré :</div>';
  for (var i = 0; i < all.length; i++) {
    var item   = all[i];
    var icon   = item.type==='interro' ? '&#128308;' : item.type==='devoir' ? '&#128218;' : '&#128221;';
    var isTask = !!item.dueDate;
    var delFn  = isTask
      ? 'deleteTask(\'' + item.id + '\')'
      : 'deleteSlotNote(\'' + slotKey + '\',\'' + item.id + '\')';
    html += '<div style="display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid #f5f5f5">'
      + '<span style="font-size:0.85rem;flex:1;font-weight:700;color:#555">' + icon + ' ' + item.text + '</span>'
      + '<button onclick="' + delFn + '" style="background:none;border:none;cursor:pointer;color:#ccc;font-size:1rem">✕</button>'
      + '</div>';
  }
  el.innerHTML = html;
}

function saveNote() {
  var text = document.getElementById('noteText').value.trim();
  if (!text || !currentSlot) return;

  var data    = getData();
  var dayKey  = currentSlot.dayKey;
  var slotIdx = currentSlot.slotIdx;
  var subject = currentSlot.subject;
  var id      = Date.now().toString();

  if (currentType === 'note') {
    // Note → attachée au slot du jour de création
    var k = dayKey + '_' + slotIdx;
    if (!data.slotNotes[k]) data.slotNotes[k] = [];
    data.slotNotes[k].push({ id: id, text: text, type: 'note' });
  } else {
    // Devoir / Interro → attaché à la date d'échéance choisie
    var dueDate = document.getElementById('dueDate').value || dayKey;
    data.tasks.push({
      id: id, subject: subject, text: text,
      type: currentType, dueDate: dueDate,
      done: false, createdDate: dayKey,
      steps: currentSteps.slice(), relireDone: false
    });
  }

  saveData(data);
  document.getElementById('noteText').value = '';
  currentSteps = [];
  document.getElementById('stepInput').value = '';
  renderStepsEditor();
  renderExistingItems();
  render();
}

function deleteSlotNote(slotKey, id) {
  var data = getData();
  if (data.slotNotes[slotKey]) {
    data.slotNotes[slotKey] = data.slotNotes[slotKey].filter(function(n) { return n.id !== id; });
    if (data.slotNotes[slotKey].length === 0) delete data.slotNotes[slotKey];
  }
  saveData(data);
  renderExistingItems();
  render();
}

function deleteTask(id) {
  var data = getData();
  data.tasks = data.tasks.filter(function(t) { return t.id !== id; });
  saveData(data);
  renderExistingItems();
  render();
}

function toggleTask(id, done) {
  var data = getData();
  var t = data.tasks.find(function(x) { return x.id === id; });
  if (t) t.done = done;
  saveData(data);
  render();
}

// ── Étapes d'un devoir/interro (cochage + ajout depuis l'agenda) ──
// Progression : étapes de l'élève + 1 étape "relire" toujours ajoutée à la fin.
function stepProgress(t) {
  var arr = t.steps || [];
  if (arr.length === 0) return null;
  var total = arr.length + 1; // +1 = relecture finale
  var done  = arr.filter(function(s) { return s.done; }).length + (t.relireDone ? 1 : 0);
  return { done: done, total: total };
}

function toggleStep(taskId, stepId, done) {
  var data = getData();
  var t = data.tasks.find(function(x) { return x.id === taskId; });
  if (t && t.steps) {
    var s = t.steps.find(function(y) { return y.id === stepId; });
    if (s) s.done = done;
  }
  saveData(data);
  render();
}

function toggleRelire(taskId, done) {
  var data = getData();
  var t = data.tasks.find(function(x) { return x.id === taskId; });
  if (t) t.relireDone = done;
  saveData(data);
  render();
}

function addAgendaStep(taskId) {
  var v = prompt('Nouvelle étape :');
  if (v === null) return;
  v = v.trim();
  if (!v) return;
  var data = getData();
  var t = data.tasks.find(function(x) { return x.id === taskId; });
  if (!t) return;
  if (!t.steps) t.steps = [];
  t.steps.push({ id: newStepId(), text: v, done: false });
  saveData(data);
  render();
}

// ═══════════════════════════════════════
//  AGENDA (panel "À faire")
// ═══════════════════════════════════════
function toggleAgenda() {
  agendaOpen = !agendaOpen;
  document.getElementById('agendaPanel').classList.toggle('open', agendaOpen);
  if (agendaOpen) renderAgendaPanel();
}

function renderAgendaBadge() {
  var data = getData();
  var todo = data.tasks.filter(function(t) { return !t.done; }).length;
  var badge = document.getElementById('agendaBadge');
  if (todo > 0) { badge.textContent = todo; badge.style.display = 'flex'; }
  else badge.style.display = 'none';
}

function renderAgendaPanel() {
  var data = getData();
  var container = document.getElementById('agendaContent');
  container.innerHTML = '';
  var today = new Date(); today.setHours(0,0,0,0);

  var pending = data.tasks.filter(function(t) { return !t.done; })
    .sort(function(a,b) { return new Date(a.dueDate) - new Date(b.dueDate); });
  var done = data.tasks.filter(function(t) { return t.done; });

  if (pending.length === 0 && done.length === 0) {
    container.innerHTML = '<div class="agenda-empty">Rien à faire ! &#127881;</div>';
    return;
  }

  var groups = { late:[], today:[], soon:[], ok:[] };
  pending.forEach(function(t) {
    var due  = new Date(t.dueDate + 'T00:00:00');
    var diff = Math.floor((due - today) / 86400000);
    var obj  = Object.assign({}, t, { diff: diff });
    if (diff < 0)       groups.late.push(obj);
    else if (diff <= 1) groups.today.push(obj);
    else if (diff <= 5) groups.soon.push(obj);
    else                groups.ok.push(obj);
  });

  function renderGroup(items, label) {
    if (items.length === 0) return;
    var gt = document.createElement('div');
    gt.className = 'agenda-group-title';
    gt.textContent = label;
    container.appendChild(gt);
    items.forEach(function(t) { container.appendChild(buildAgendaItem(t)); });
  }

  renderGroup(groups.late,  '&#128308; En retard');
  renderGroup(groups.today, '&#9889; Aujourd\'hui / Demain');
  renderGroup(groups.soon,  '&#129505; Cette semaine');
  renderGroup(groups.ok,    '&#9989; Plus tard');

  if (done.length > 0) {
    var gt2 = document.createElement('div');
    gt2.className = 'agenda-group-title';
    gt2.textContent = '✓ Terminé';
    container.appendChild(gt2);
    done.forEach(function(t) { container.appendChild(buildAgendaItem(t)); });
  }
}

function buildAgendaItem(t) {
  var due   = new Date(t.dueDate + 'T00:00:00');
  var today = new Date(); today.setHours(0,0,0,0);
  var diff  = Math.floor((due - today) / 86400000);

  var urgClass = 'ok', chipClass = 'chip-green', chipText = 'Dans ' + diff + 'j';
  if (diff < 0)      { urgClass='urgent'; chipClass='chip-red';    chipText='En retard'; }
  else if (diff===0) { urgClass='urgent'; chipClass='chip-red';    chipText='Aujourd\'hui'; }
  else if (diff===1) { urgClass='soon';   chipClass='chip-orange'; chipText='Demain'; }
  else if (diff<=5)  { urgClass='soon';   chipClass='chip-orange'; chipText='Dans ' + diff + 'j'; }
  if (t.done)        { urgClass='ok';     chipClass='chip-green';  chipText='Fait ✓'; }

  var color  = SUBJECT_COLORS[t.subject] || '#888';
  var dueStr = due.getDate() + '/' + (due.getMonth()+1);
  var icon   = t.type==='interro' ? '&#128308;' : '&#128218;';

  // ── Bloc étapes (devoir/interro non terminé) ──
  var stepsHTML = '';
  if (!t.done && (t.type === 'devoir' || t.type === 'interro')) {
    var prog = stepProgress(t);
    if (prog) {
      var pct = Math.round(prog.done / prog.total * 100);
      stepsHTML += '<div class="agenda-steps">';
      stepsHTML += '<div class="progress-wrap"><div class="progress-bar">'
        + '<div class="progress-fill" style="width:' + pct + '%"></div></div>'
        + '<span class="progress-label">' + prog.done + '/' + prog.total + '</span></div>';

      // étapes affichées = étapes de l'élève + l'étape "relire" finale
      var dsteps = (t.steps || []).map(function(s) {
        return { id: s.id, text: s.text, done: s.done, relire: false };
      });
      dsteps.push({ id: '__relire', text: 'Relire avant de rendre', done: !!t.relireDone, relire: true });

      var currentIdx = -1;
      for (var ci = 0; ci < dsteps.length; ci++) { if (!dsteps[ci].done) { currentIdx = ci; break; } }

      for (var k = 0; k < dsteps.length; k++) {
        var st = dsteps[k];
        var rowCls = st.done ? 'step-done' : (k === currentIdx ? 'step-current' : 'step-todo');
        var label = (st.relire ? '👀 ' : '') + escapeHtml(st.text);
        if (k === currentIdx && !st.done) label = '👉 ' + label;
        var toggleFn = st.relire
          ? 'toggleRelire(\'' + t.id + '\', this.checked)'
          : 'toggleStep(\'' + t.id + '\', \'' + st.id + '\', this.checked)';
        stepsHTML += '<div class="step-row ' + rowCls + '">'
          + '<input type="checkbox" ' + (st.done ? 'checked' : '') + ' onchange="' + toggleFn + '">'
          + '<span class="step-text">' + label + '</span>'
          + '</div>';
      }

      if (prog.done === prog.total) {
        stepsHTML += '<div class="steps-done-msg">✅ Tout est fait — coche le devoir en haut !</div>';
      }
      stepsHTML += '<button class="step-add-btn" onclick="addAgendaStep(\'' + t.id + '\')">＋ étape</button>';
      stepsHTML += '</div>';
    } else {
      stepsHTML = '<div class="agenda-steps">'
        + '<button class="step-cut-btn" onclick="addAgendaStep(\'' + t.id + '\')">✂️ Découper en petites étapes</button>'
        + '</div>';
    }
  }

  var div = document.createElement('div');
  div.className = 'agenda-item ' + (t.done ? 'ok' : urgClass) + (stepsHTML ? ' has-steps' : '');

  div.innerHTML = '<input type="checkbox" class="agenda-check" '
    + (t.done ? 'checked' : '') + ' onchange="toggleTask(\'' + t.id + '\', this.checked)">'
    + '<div class="agenda-info">'
    + '<div class="agenda-item-text">' + icon + ' ' + escapeHtml(t.text) + '</div>'
    + '<div class="agenda-item-meta"><span style="color:' + color + ';font-weight:800">'
    + t.subject + '</span> &middot; ' + dueStr + '</div>'
    + stepsHTML
    + '</div>'
    + '<span class="urgency-chip ' + chipClass + '">' + chipText + '</span>';

  return div;
}

// ═══════════════════════════════════════
//  INIT
// ═══════════════════════════════════════
render();
</script>
</body>
</html>

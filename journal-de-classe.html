<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Journal de classe — Ethan</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #FFF8F0;
    --dark: #2D2D2D;
    --blue: #4A90E2;
    --orange: #FF6B35;
    --green: #4CAF50;
    --yellow: #FFD93D;
    --purple: #9B59B6;
    --red: #E74C3C;
    --pink: #FF6B9D;
    --shadow: 3px 3px 0px rgba(0,0,0,0.12);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--cream);
    min-height: 100vh;
  }

  /* TOP BAR */
  .topbar {
    background: white;
    border-bottom: 3px solid var(--dark);
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .back-btn {
    background: var(--cream);
    border: 2px solid var(--dark);
    border-radius: 10px;
    padding: 6px 12px;
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 0.85rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .topbar-title {
    font-family: 'Fredoka One', cursive;
    font-size: 1.3rem;
    color: var(--blue);
    flex: 1;
  }

  .agenda-btn {
    position: relative;
    background: var(--orange);
    border: 2px solid var(--dark);
    border-radius: 12px;
    padding: 6px 14px;
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 0.85rem;
    color: white;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .badge {
    background: var(--red);
    color: white;
    font-size: 0.7rem;
    font-weight: 800;
    min-width: 20px;
    height: 20px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: absolute;
    top: -8px;
    right: -8px;
    border: 2px solid white;
  }

  /* NAV JOURS */
  .days-nav {
    background: white;
    border-bottom: 2px solid #eee;
    padding: 10px 12px;
    display: flex;
    gap: 6px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .days-nav::-webkit-scrollbar { display: none; }

  .day-pill {
    flex-shrink: 0;
    padding: 6px 14px;
    border-radius: 20px;
    border: 2px solid #ddd;
    font-weight: 800;
    font-size: 0.82rem;
    cursor: pointer;
    background: white;
    color: #999;
    transition: all 0.15s;
    position: relative;
  }

  .day-pill.active {
    background: var(--blue);
    border-color: var(--blue);
    color: white;
    box-shadow: 2px 2px 0px rgba(74,144,226,0.4);
  }

  .day-pill.today:not(.active) {
    border-color: var(--orange);
    color: var(--orange);
  }

  .day-pill.weekend {
    background: #F5F0FF;
    border-color: #C8B8E8;
    color: var(--purple);
  }
  .day-pill.weekend.active {
    background: var(--purple);
    border-color: var(--purple);
    color: white;
  }

  .day-pill.ferie {
    background: #FFF0EE;
    border-color: #F9C0B8;
    color: var(--red);
  }
  .day-pill.ferie.active {
    background: var(--red);
    border-color: var(--red);
    color: white;
  }

  .dot {
    width: 6px;
    height: 6px;
    background: var(--orange);
    border-radius: 50%;
    position: absolute;
    bottom: 2px;
    left: 50%;
    transform: translateX(-50%);
  }

  /* DATE HEADER */
  .date-header {
    padding: 14px 16px 6px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .date-nav-btn {
    background: white;
    border: 2px solid var(--dark);
    border-radius: 10px;
    width: 36px;
    height: 36px;
    font-size: 1rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
  }

  .date-label {
    flex: 1;
    font-family: 'Fredoka One', cursive;
    font-size: 1.2rem;
    color: var(--dark);
    text-align: center;
  }

  /* PRÉVU AUJOURD'HUI */
  .due-today {
    margin: 8px 16px;
    background: white;
    border: 2px solid var(--orange);
    border-radius: 16px;
    padding: 12px 14px;
  }

  .due-today-title {
    font-family: 'Fredoka One', cursive;
    font-size: 1rem;
    color: var(--orange);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .due-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 0;
    border-bottom: 1px solid #f0f0f0;
  }
  .due-item:last-child { border-bottom: none; }

  .due-item input[type="checkbox"] {
    width: 20px;
    height: 20px;
    accent-color: var(--green);
    cursor: pointer;
    flex-shrink: 0;
  }

  .due-item-label {
    flex: 1;
    font-size: 0.9rem;
    font-weight: 700;
    color: var(--dark);
  }
  .due-item-label.done {
    text-decoration: line-through;
    color: #aaa;
  }

  .due-subject-chip {
    font-size: 0.72rem;
    font-weight: 800;
    padding: 2px 8px;
    border-radius: 10px;
    border: 2px solid currentColor;
    flex-shrink: 0;
  }

  /* CONGE BANNER */
  .conge-banner {
    margin: 8px 16px;
    background: #FFF0F0;
    border: 2px solid var(--red);
    border-radius: 14px;
    padding: 14px 16px;
    text-align: center;
  }
  .conge-banner .icon { font-size: 2rem; }
  .conge-banner .name {
    font-family: 'Fredoka One', cursive;
    font-size: 1.2rem;
    color: var(--red);
    margin-top: 4px;
  }
  .conge-banner .sub { font-size: 0.85rem; color: #888; margin-top: 2px; }

  /* WEEKEND VIEW */
  .free-day {
    margin: 8px 16px;
    background: white;
    border: 2px solid var(--purple);
    border-radius: 16px;
    padding: 16px;
  }
  .free-day-title {
    font-family: 'Fredoka One', cursive;
    color: var(--purple);
    font-size: 1.1rem;
    margin-bottom: 8px;
  }

  /* GRILLE HORAIRE */
  .schedule {
    padding: 8px 16px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .slot {
    background: white;
    border: 2px solid #E8E8E8;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: var(--shadow);
  }

  .slot-header {
    display: flex;
    align-items: center;
    padding: 10px 14px;
    cursor: pointer;
    gap: 10px;
    transition: background 0.1s;
  }
  .slot-header:active { background: #f8f8f8; }

  .slot-time {
    font-size: 0.78rem;
    font-weight: 800;
    color: #aaa;
    min-width: 50px;
    flex-shrink: 0;
  }

  .slot-color {
    width: 10px;
    height: 40px;
    border-radius: 4px;
    flex-shrink: 0;
  }

  .slot-info {
    flex: 1;
  }

  .slot-subject {
    font-family: 'Fredoka One', cursive;
    font-size: 1.05rem;
    color: var(--dark);
  }

  .slot-room {
    font-size: 0.76rem;
    color: #aaa;
    font-weight: 600;
  }

  .slot-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-left: 70px;
    margin-bottom: 10px;
    padding: 0 14px 8px;
    display: none;
  }

  .slot-tags.has-content {
    display: flex;
  }

  .tag {
    font-size: 0.76rem;
    font-weight: 800;
    padding: 3px 10px;
    border-radius: 10px;
    border: 2px solid currentColor;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .tag-note     { color: var(--purple); background: #F8F0FF; }
  .tag-devoir   { color: var(--blue);   background: #EEF4FF; }
  .tag-interro  { color: var(--red);    background: #FFF0EE; }
  .tag-done     { color: var(--green);  background: #EEFBEE; text-decoration: line-through; opacity: 0.7; }

  /* MODAL */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 200;
    align-items: flex-end;
    justify-content: center;
    padding: 20px;
  }
  .modal-overlay.open { display: flex; }

  .modal {
    background: white;
    border: 3px solid var(--dark);
    border-radius: 24px 24px 16px 16px;
    width: 100%;
    max-width: 480px;
    max-height: 85vh;
    overflow-y: auto;
    padding: 20px;
    box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  }

  .modal-title {
    font-family: 'Fredoka One', cursive;
    font-size: 1.3rem;
    color: var(--dark);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .type-buttons {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }

  .type-btn {
    flex: 1;
    min-width: 80px;
    padding: 10px 8px;
    border-radius: 14px;
    border: 2px solid #ddd;
    background: white;
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 0.85rem;
    cursor: pointer;
    text-align: center;
    transition: all 0.15s;
  }
  .type-btn.active-note   { border-color: var(--purple); background: #F8F0FF; color: var(--purple); }
  .type-btn.active-devoir { border-color: var(--blue);   background: #EEF4FF; color: var(--blue); }
  .type-btn.active-interro{ border-color: var(--red);    background: #FFF0EE; color: var(--red); }

  .modal-field {
    margin-bottom: 12px;
  }
  .modal-field label {
    display: block;
    font-weight: 800;
    font-size: 0.85rem;
    color: #666;
    margin-bottom: 5px;
  }
  .modal-field input, .modal-field textarea {
    width: 100%;
    padding: 10px 14px;
    border: 2px solid #ddd;
    border-radius: 12px;
    font-family: 'Nunito', sans-serif;
    font-size: 1rem;
    font-weight: 600;
    color: var(--dark);
    background: #FAFAFA;
  }
  .modal-field input:focus, .modal-field textarea:focus {
    outline: none;
    border-color: var(--blue);
    background: white;
  }

  .modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 16px;
  }

  .btn-cancel {
    flex: 1;
    padding: 12px;
    border-radius: 14px;
    border: 2px solid #ddd;
    background: white;
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    cursor: pointer;
    font-size: 0.95rem;
  }

  .btn-save {
    flex: 2;
    padding: 12px;
    border-radius: 14px;
    border: 2px solid var(--blue);
    background: var(--blue);
    color: white;
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    cursor: pointer;
    font-size: 0.95rem;
  }

  /* AGENDA PANEL */
  .agenda-panel {
    display: none;
    padding: 8px 16px 20px;
  }
  .agenda-panel.open { display: block; }

  .agenda-title {
    font-family: 'Fredoka One', cursive;
    font-size: 1.2rem;
    color: var(--orange);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .agenda-empty {
    text-align: center;
    color: #aaa;
    font-weight: 700;
    font-size: 0.95rem;
    padding: 20px;
  }

  .agenda-group-title {
    font-size: 0.78rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: #bbb;
    margin: 10px 0 6px;
  }

  .agenda-item {
    background: white;
    border: 2px solid #E8E8E8;
    border-radius: 14px;
    padding: 10px 12px;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .agenda-item.urgent   { border-color: var(--red);    background: #FFF5F5; }
  .agenda-item.soon     { border-color: var(--orange);  background: #FFF8F0; }
  .agenda-item.ok       { border-color: #ddd; }

  .agenda-check {
    width: 22px;
    height: 22px;
    accent-color: var(--green);
    cursor: pointer;
    flex-shrink: 0;
  }

  .agenda-info { flex: 1; }

  .agenda-item-text {
    font-size: 0.9rem;
    font-weight: 700;
    color: var(--dark);
  }

  .agenda-item-meta {
    font-size: 0.76rem;
    color: #aaa;
    font-weight: 600;
    margin-top: 2px;
  }

  .urgency-chip {
    font-size: 0.72rem;
    font-weight: 800;
    padding: 2px 8px;
    border-radius: 8px;
    flex-shrink: 0;
  }
  .chip-red    { background: #FFE0E0; color: var(--red); }
  .chip-orange { background: #FFE8D6; color: var(--orange); }
  .chip-green  { background: #E0F5E0; color: var(--green); }

  /* EXTRA ACTIVITY */
  .extra-section {
    margin: 0 16px 16px;
    background: white;
    border: 2px solid #E8E8E8;
    border-radius: 16px;
    padding: 12px 14px;
  }
  .extra-title {
    font-family: 'Fredoka One', cursive;
    font-size: 0.95rem;
    color: #888;
    margin-bottom: 10px;
  }
  .extra-input-row {
    display: flex;
    gap: 8px;
  }
  .extra-input {
    flex: 1;
    padding: 8px 12px;
    border: 2px solid #ddd;
    border-radius: 10px;
    font-family: 'Nunito', sans-serif;
    font-size: 0.9rem;
    font-weight: 600;
  }
  .extra-add-btn {
    background: var(--green);
    border: 2px solid var(--dark);
    border-radius: 10px;
    color: white;
    font-weight: 800;
    font-size: 1rem;
    width: 38px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .extra-list {
    margin-top: 8px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .extra-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--dark);
    padding: 4px 0;
    border-bottom: 1px solid #f5f5f5;
  }
  .extra-del { background: none; border: none; cursor: pointer; font-size: 1rem; color: #ccc; }
</style>
</head>

<!-- TOP BAR -->
<div class="topbar">
  <button class="back-btn" onclick="window.location.href='index.html'">← Accueil</button>
  <div class="topbar-title">📓 Journal de classe</div>
  <button class="agenda-btn" onclick="toggleAgenda()" id="agendaBtn">
    📋 À faire
    <span class="badge" id="agendaBadge" style="display:none"></span>
  </button>
</div>

<!-- AGENDA PANEL -->
<div class="agenda-panel" id="agendaPanel">
  <div class="agenda-title">📋 Tous mes travaux</div>
  <div id="agendaContent"></div>
</div>

<!-- NAV JOURS -->
<div class="days-nav" id="daysNav"></div>

<!-- CONTENU DU JOUR -->
<div id="dayContent"></div>

<!-- MODAL AJOUT NOTE -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-title" id="modalTitle">📝 Ajouter</div>

    <div class="type-buttons">
      <button class="type-btn active-note" id="btnNote"    onclick="setType('note')">📝 Note</button>
      <button class="type-btn"             id="btnDevoir"  onclick="setType('devoir')">📚 Devoir</button>
      <button class="type-btn"             id="btnInterro" onclick="setType('interro')">🔴 Interro</button>
    </div>

    <div class="modal-field">
      <label>Description</label>
      <textarea id="noteText" rows="2" placeholder="Ex : exercices page 42, chapitre 3…"></textarea>
    </div>

    <div class="modal-field" id="dueDateField">
      <label id="dueDateLabel">Pour le</label>
      <input type="date" id="dueDate">
    </div>

    <div id="existingItems"></div>

    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Annuler</button>
      <button class="btn-save"   onclick="saveNote()">Enregistrer</button>
    </div>
  </div>
</div>

  '2026-04-09': 'Vacances de Pâques',
  '2026-04-10': 'Vacances de Pâques',
  '2026-04-13': 'Vacances de Pâques',
  '2026-04-14': 'Vacances de Pâques',
  '2026-04-15': 'Vacances de Pâques',
  '2026-04-16': 'Vacances de Pâques',
  '2026-04-17': 'Vacances de Pâques',
  '2026-05-01': 'Fête du Travail',
  '2026-05-14': 'Ascension',
  '2026-05-15': 'Pont Ascension',
  '2026-05-25': 'Lundi de Pentecôte',
  '2026-06-29': 'Début vacances été',
};

const JOURS_COURT = ['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];
const JOURS_LONG  = ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
const MOIS = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];

// ═══════════════════════════════
//  ÉTAT
// ═══════════════════════════════
let currentDate = new Date();
currentDate.setHours(0,0,0,0);

let currentSlot = null;   // {dateKey, slotIdx, subject}
let currentType = 'note';
let agendaOpen  = false;

// Données localStorage
// slotNotes[dateKey_slotIdx] = [{id, text, type:'note'}]
// tasks = [{id, subject, text, type:'devoir'|'interro', dueDate:'YYYY-MM-DD', done:false, createdDate:'YYYY-MM-DD'}]
// extras[dateKey] = [{id, text}]

function getData() {
  return {
    slotNotes: JSON.parse(localStorage.getItem('zone_slot_notes') || '{}'),
    tasks:     JSON.parse(localStorage.getItem('zone_jdc_tasks')  || '[]'),
    extras:    JSON.parse(localStorage.getItem('zone_extras')     || '{}'),
  };
}

function saveData(d) {
  localStorage.setItem('zone_slot_notes', JSON.stringify(d.slotNotes));
  localStorage.setItem('zone_jdc_tasks',  JSON.stringify(d.tasks));
  localStorage.setItem('zone_extras',     JSON.stringify(d.extras));
}

function dateKey(d) {
  return d.toISOString().split('T')[0];
}

function parseDateKey(key) {
  const p = new Date(key + 'T00:00:00');
  return p;
}

// ═══════════════════════════════
//  NAV JOURS
// ═══════════════════════════════
function buildDaysNav() {
  const nav = document.getElementById('daysNav');
  nav.innerHTML = '';
  const today = new Date();
  today.setHours(0,0,0,0);

  // Afficher 7 jours centrés sur aujourd'hui (3 avant, auj, 3 après)
  const start = new Date(today);
  start.setDate(today.getDate() - 14);

  for (let i = 0; i < 42; i++) {
    const d = new Date(start);
    d.setDate(start.getDate() + i);
    const key = dateKey(d);
    const dow = d.getDay(); // 0=dim, 6=sam
    const isWE    = (dow === 0 || dow === 6);
    const isFerie = !!CONGES[key];
    const isToday = (d.getTime() === today.getTime());
    const isActive= (d.getTime() === currentDate.getTime());

    const data = getData();
    const hasNotes = hasDataForDay(data, key);

    const pill = document.createElement('div');
    pill.className = 'day-pill' +
      (isWE && !isFerie ? ' weekend' : '') +
      (isFerie ? ' ferie' : '') +
      (isToday ? ' today' : '') +
      (isActive ? ' active' : '');

    pill.innerHTML = `<div>${JOURS_COURT[dow]}</div><div style="font-size:0.7rem">${d.getDate()}</div>`;
    if (hasNotes) pill.innerHTML += '<div class="dot"></div>';
    pill.onclick = () => { currentDate = d; render(); scrollNav(pill); };
    nav.appendChild(pill);

    if (isActive) setTimeout(() => scrollNav(pill), 50);
  }
}

function scrollNav(pill) {
  pill.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
}

function hasDataForDay(data, key) {
  if (data.tasks.some(t => t.dueDate === key)) return true;
  if (Object.keys(data.slotNotes).some(k => k.startsWith(key))) return true;
  if (data.extras[key] && data.extras[key].length > 0) return true;
  return false;
}

// ═══════════════════════════════
//  RENDER PRINCIPAL
// ═══════════════════════════════
function render() {
  buildDaysNav();
  renderDayContent();
  renderAgendaBadge();
  if (agendaOpen) renderAgendaPanel();
}

function renderDayContent() {
  const key = dateKey(currentDate);
  const dow = currentDate.getDay(); // 0=dim, 6=sam
  const isWE    = (dow === 0 || dow === 6);
  const isFerie = CONGES[key];
  const container = document.getElementById('dayContent');
  container.innerHTML = '';

  // En-tête date
  const dh = document.createElement('div');
  dh.className = 'date-header';
  dh.innerHTML = `
    <button class="date-nav-btn" onclick="changeDay(-1)">←</button>
    <div class="date-label">${JOURS_LONG[dow]} ${currentDate.getDate()} ${MOIS[currentDate.getMonth()]} ${currentDate.getFullYear()}</div>
    <button class="date-nav-btn" onclick="changeDay(1)">→</button>
  `;
  container.appendChild(dh);

  // Bloc "Prévu aujourd'hui"
  renderDueToday(container, key);

  // Congé ou WE
  if (isFerie) {
    const b = document.createElement('div');
    b.className = 'conge-banner';
    b.innerHTML = `<div class="icon">🎉</div><div class="name">${isFerie}</div><div class="sub">Jour férié / Congé scolaire</div>`;
    container.appendChild(b);
  }

  if (isWE || isFerie) {
    // Vue jour libre
    renderFreeDaySection(container, key);
  } else {
    // Grille horaire
    const slots = SCHEDULE[dow];
    if (slots) {
      const sched = document.createElement('div');
      sched.className = 'schedule';
      slots.forEach((slot, idx) => {
        sched.appendChild(buildSlot(slot, idx, key));
      });
      container.appendChild(sched);
    }
  }

  // Activités extra
  renderExtras(container, key);
}

function renderDueToday(container, key) {
  const data = getData();
  const todayTasks = data.tasks.filter(t => t.dueDate === key && !t.done);
  if (todayTasks.length === 0) return;

  const block = document.createElement('div');
  block.className = 'due-today';
  block.innerHTML = `<div class="due-today-title">⚡ Prévu aujourd'hui (${todayTasks.length})</div>`;

  todayTasks.forEach(task => {
    const item = document.createElement('div');
    item.className = 'due-item';
    const color = SUBJECT_COLORS[task.subject] || '#888';
    item.innerHTML = `
      <input type="checkbox" onchange="toggleTask('${task.id}', this.checked)">
      <div class="due-item-label">${task.text}</div>
      <span class="due-subject-chip" style="color:${color};border-color:${color}">${task.subject}</span>
    `;
    block.appendChild(item);
  });
  container.appendChild(block);
}

// Map subject → color
const SUBJECT_COLORS = {};
Object.values(SCHEDULE).flat().forEach(s => { SUBJECT_COLORS[s.s] = s.c; });

function renderFreeDaySection(container, key) {
  const data = getData();
  const dayTasks = data.tasks.filter(t => t.dueDate === key);

  const free = document.createElement('div');
  free.className = 'free-day';
  free.innerHTML = `<div class="free-day-title">🏠 Jour libre</div>`;

  if (dayTasks.length > 0) {
    const ul = document.createElement('div');
    dayTasks.forEach(task => {
      const it = document.createElement('div');
      it.className = 'due-item';
      const color = SUBJECT_COLORS[task.subject] || '#888';
      it.innerHTML = `
        <input type="checkbox" ${task.done?'checked':''} onchange="toggleTask('${task.id}', this.checked)">
        <div class="due-item-label ${task.done?'done':''}">${task.text}</div>
        <span class="due-subject-chip" style="color:${color};border-color:${color}">${task.subject}</span>
      `;
      ul.appendChild(it);
    });
    free.appendChild(ul);
  } else {
    free.innerHTML += `<div style="color:#aaa;font-size:0.85rem;font-weight:700">Rien de prévu 🎉</div>`;
  }
  container.appendChild(free);
}

function buildSlot(slot, idx, dayKey) {
  const isPause = slot.s.includes('Pause');
  const data = getData();
  const slotKey = `${dayKey}_${idx}`;

  // Notes (type note) sur ce slot
  const slotNotes = (data.slotNotes[slotKey] || []);
  // Tâches (devoirs/interros) dues ce jour pour cette matière
  const slotTasks = data.tasks.filter(t => t.dueDate === dayKey && t.subject === slot.s);

  const div = document.createElement('div');
  div.className = 'slot';

  const header = document.createElement('div');
  header.className = 'slot-header';
  header.innerHTML = `
    <div class="slot-time">${slot.t.split('–')[0]}</div>
    <div class="slot-color" style="background:${slot.c}"></div>
    <div class="slot-info">
      <div class="slot-subject">${slot.s}</div>
      ${slot.r ? `<div class="slot-room">📍 ${slot.r}</div>` : ''}
    </div>
    ${!isPause ? '<div style="color:#ccc;font-size:1.1rem">＋</div>' : ''}
  `;
  if (!isPause) {
    header.onclick = () => openModal(dayKey, idx, slot.s);
  }
  div.appendChild(header);

  // Tags pour notes + tâches
  const tagsAll = [...slotNotes, ...slotTasks];
  if (tagsAll.length > 0) {
    const tagsDiv = document.createElement('div');
    tagsDiv.className = 'slot-tags has-content';
    tagsAll.forEach(item => {
      const tag = document.createElement('div');
      const isDone = item.done || false;
      const cls = isDone ? 'tag-done' : (item.type === 'interro' ? 'tag-interro' : item.type === 'devoir' ? 'tag-devoir' : 'tag-note');
      const icon = item.type === 'interro' ? '🔴' : item.type === 'devoir' ? '📚' : '📝';
      tag.className = `tag ${cls}`;
      tag.innerHTML = `${icon} ${item.text.length > 30 ? item.text.substring(0,30)+'…' : item.text}`;
      tag.onclick = (e) => { e.stopPropagation(); openModal(dayKey, idx, slot.s); };
      tagsDiv.appendChild(tag);
    });
    div.appendChild(tagsDiv);
  }

  return div;
}

// ═══════════════════════════════
//  MODAL
// ═══════════════════════════════
function openModal(dayKey, slotIdx, subject) {
  currentSlot = {dayKey, slotIdx, subject};
  currentType = 'note';
  updateTypeButtons();

  document.getElementById('modalTitle').innerHTML = `📝 ${subject}`;
  document.getElementById('noteText').value = '';

  const today = dateKey(new Date());
  document.getElementById('dueDate').value = today;
  document.getElementById('dueDateField').style.display = 'none';

  renderExistingItems();
  document.getElementById('modalOverlay').classList.add('open');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  currentSlot = null;
}

function setType(type) {
  currentType = type;
  updateTypeButtons();
  document.getElementById('dueDateField').style.display = (type === 'note') ? 'none' : 'block';
  document.getElementById('dueDateLabel').textContent = type === 'interro' ? 'Date de l\'interro' : 'Pour le';
}

function updateTypeButtons() {
  document.getElementById('btnNote').className    = 'type-btn' + (currentType==='note'   ? ' active-note'   : '');
  document.getElementById('btnDevoir').className  = 'type-btn' + (currentType==='devoir' ? ' active-devoir' : '');
  document.getElementById('btnInterro').className = 'type-btn' + (currentType==='interro'? ' active-interro': '');
}

function renderExistingItems() {
  if (!currentSlot) return;
  const data = getData();
  const {dayKey, slotIdx, subject} = currentSlot;
  const slotKey = `${dayKey}_${slotIdx}`;
  const notes = data.slotNotes[slotKey] || [];
  const tasks = data.tasks.filter(t => t.dueDate === dayKey && t.subject === subject);
  const all   = [...notes, ...tasks];

  const el = document.getElementById('existingItems');
  if (all.length === 0) { el.innerHTML = ''; return; }

  el.innerHTML = '<div style="font-size:0.8rem;font-weight:800;color:#aaa;margin:8px 0 4px">Déjà enregistré :</div>';
  all.forEach(item => {
    const d = document.createElement('div');
    d.style.cssText = 'display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid #f0f0f0;';
    const icon = item.type==='interro' ? '🔴' : item.type==='devoir' ? '📚' : '📝';
    const isTask = !!item.dueDate;
    const delFn = isTask ? `deleteTask('${item.id}')` : `deleteSlotNote('${slotKey}','${item.id}')`;
    d.innerHTML = `<span style="font-size:0.85rem;flex:1;font-weight:700;color:#555">${icon} ${item.text}</span><button onclick="${delFn}" style="background:none;border:none;cursor:pointer;color:#ccc;font-size:0.9rem">✕</button>`;
    el.appendChild(d);
  });
}

function saveNote() {
  const text = document.getElementById('noteText').value.trim();
  if (!text || !currentSlot) return;

  const data = getData();
  const {dayKey, slotIdx, subject} = currentSlot;
  const id = Date.now().toString();

  if (currentType === 'note') {
    const key = `${dayKey}_${slotIdx}`;
    if (!data.slotNotes[key]) data.slotNotes[key] = [];
    data.slotNotes[key].push({id, text, type:'note'});
  } else {
    const dueDate = document.getElementById('dueDate').value || dayKey;
    data.tasks.push({id, subject, text, type:currentType, dueDate, done:false, createdDate:dayKey});
  }

  saveData(data);
  document.getElementById('noteText').value = '';
  renderExistingItems();
  render();
}

function deleteSlotNote(slotKey, id) {
  const data = getData();
  if (data.slotNotes[slotKey]) {
    data.slotNotes[slotKey] = data.slotNotes[slotKey].filter(n => n.id !== id);
    if (data.slotNotes[slotKey].length === 0) delete data.slotNotes[slotKey];
  }
  saveData(data);
  renderExistingItems();
  render();
}

function deleteTask(id) {
  const data = getData();
  data.tasks = data.tasks.filter(t => t.id !== id);
  saveData(data);
  renderExistingItems();
  render();
}

function toggleTask(id, done) {
  const data = getData();
  const t = data.tasks.find(t => t.id === id);
  if (t) t.done = done;
  saveData(data);
  render();
}

// ═══════════════════════════════
//  AGENDA
// ═══════════════════════════════
function toggleAgenda() {
  agendaOpen = !agendaOpen;
  document.getElementById('agendaPanel').classList.toggle('open', agendaOpen);
  if (agendaOpen) renderAgendaPanel();
}

function renderAgendaBadge() {
  const data = getData();
  const todo = data.tasks.filter(t => !t.done).length;
  const badge = document.getElementById('agendaBadge');
  if (todo > 0) { badge.textContent = todo; badge.style.display = 'flex'; }
  else badge.style.display = 'none';
}

function renderAgendaPanel() {
  const data = getData();
  const container = document.getElementById('agendaContent');
  container.innerHTML = '';

  const today = new Date(); today.setHours(0,0,0,0);

  const pending = data.tasks.filter(t => !t.done).sort((a,b) => new Date(a.dueDate)-new Date(b.dueDate));
  const done    = data.tasks.filter(t => t.done);

  if (pending.length === 0 && done.length === 0) {
    container.innerHTML = '<div class="agenda-empty">Rien à faire ! 🎉</div>';
    return;
  }

  const groups = {late:[], today:[], soon:[], ok:[]};
  pending.forEach(t => {
    const due = new Date(t.dueDate + 'T00:00:00');
    const diff = Math.floor((due - today) / 86400000);
    if (diff < 0)      groups.late.push({...t, diff});
    else if (diff <= 1) groups.today.push({...t, diff});
    else if (diff <= 5) groups.soon.push({...t, diff});
    else                groups.ok.push({...t, diff});
  });

  const renderGroup = (items, label) => {
    if (items.length === 0) return;
    const gt = document.createElement('div');
    gt.className = 'agenda-group-title';
    gt.textContent = label;
    container.appendChild(gt);
    items.forEach(t => container.appendChild(buildAgendaItem(t)));
  };

  renderGroup(groups.late,  '🔴 En retard');
  renderGroup(groups.today, '⚡ Aujourd\'hui / Demain');
  renderGroup(groups.soon,  '🟠 Cette semaine');
  renderGroup(groups.ok,    '✅ Plus tard');

  if (done.length > 0) {
    const gt = document.createElement('div');
    gt.className = 'agenda-group-title';
    gt.textContent = '✓ Terminé';
    container.appendChild(gt);
    done.forEach(t => container.appendChild(buildAgendaItem(t)));
  }
}

function buildAgendaItem(t) {
  const due = new Date(t.dueDate + 'T00:00:00');
  const today = new Date(); today.setHours(0,0,0,0);
  const diff = Math.floor((due - today) / 86400000);

  let urgClass = 'ok';
  let chipClass = 'chip-green';
  let chipText  = `Dans ${diff}j`;
  if (diff < 0)      { urgClass='urgent'; chipClass='chip-red';   chipText='En retard'; }
  else if (diff===0) { urgClass='urgent'; chipClass='chip-red';   chipText='Aujourd\'hui'; }
  else if (diff===1) { urgClass='soon';   chipClass='chip-orange'; chipText='Demain'; }
  else if (diff<=5)  { urgClass='soon';   chipClass='chip-orange'; chipText=`Dans ${diff}j`; }
  if (t.done)        { urgClass='ok'; chipClass='chip-green'; chipText='Fait ✓'; }

  const div = document.createElement('div');
  div.className = `agenda-item ${t.done?'ok':urgClass}`;

  const color = SUBJECT_COLORS[t.subject] || '#888';
  const dueStr = due.getDate() + '/' + (due.getMonth()+1);
  const icon = t.type==='interro' ? '🔴' : '📚';

  div.innerHTML = `
    <input type="checkbox" class="agenda-check" ${t.done?'checked':''} onchange="toggleTask('${t.id}', this.checked)">
    <div class="agenda-info">
      <div class="agenda-item-text ${t.done?'':''}">
        ${icon} ${t.text}
      </div>
      <div class="agenda-item-meta">
        <span style="color:${color};font-weight:800">${t.subject}</span> · ${dueStr}
      </div>
    </div>
    <span class="urgency-chip ${chipClass}">${chipText}</span>
  `;
  return div;
}

// ═══════════════════════════════
//  ACTIVITÉS EXTRA
// ═══════════════════════════════
function renderExtras(container, key) {
  const data = getData();
  const extras = data.extras[key] || [];

  const section = document.createElement('div');
  section.className = 'extra-section';
  section.innerHTML = `<div class="extra-title">🏃 Activités / Rappels du jour</div>`;

  const row = document.createElement('div');
  row.className = 'extra-input-row';
  row.innerHTML = `
    <input class="extra-input" id="extraInput_${key}" type="text" placeholder="Sport, rdv, matériel…">
    <button class="extra-add-btn" onclick="addExtra('${key}')">+</button>
  `;
  section.appendChild(row);

  const list = document.createElement('div');
  list.className = 'extra-list';
  extras.forEach(ex => {
    const item = document.createElement('div');
    item.className = 'extra-item';
    item.innerHTML = `<span>• ${ex.text}</span><button class="extra-del" onclick="deleteExtra('${key}','${ex.id}')">✕</button>`;
    list.appendChild(item);
  });
  section.appendChild(list);
  container.appendChild(section);
}

function addExtra(key) {
  const input = document.getElementById(`extraInput_${key}`);
  const text  = input.value.trim();
  if (!text) return;
  const data = getData();
  if (!data.extras[key]) data.extras[key] = [];
  data.extras[key].push({id: Date.now().toString(), text});
  saveData(data);
  input.value = '';
  render();
}

function deleteExtra(key, id) {
  const data = getData();
  if (data.extras[key]) data.extras[key] = data.extras[key].filter(e => e.id !== id);
  saveData(data);
  render();
}

// ═══════════════════════════════
//  NAVIGATION JOURS
// ═══════════════════════════════
function changeDay(delta) {
  currentDate = new Date(currentDate);
  currentDate.setDate(currentDate.getDate() + delta);
  render();
}

// ═══════════════════════════════
//  INIT
// ═══════════════════════════════
render();
</script>
</body>
</html>
